  <style>
    body {
      background-color: #121212;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
    }

    .loading-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .loading-indicator {
      width: 50px;
      height: 50px;
      position: relative;
    }

    .loading-indicator:before {
      content: '';
      box-sizing: border-box;
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      border: 3px solid rgba(255, 255, 255, 0.1);
      border-top-color: #00A3FF;
      border-right-color: #FF2D55;
      animation: spinner 1.5s linear infinite;
    }

    .loading-text {
      margin-top: 20px;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      font-size: 16px;
      color: #FFFFFF;
      letter-spacing: 1.2px;
      font-weight: 500;
    }

    @keyframes spinner {
      to {
        transform: rotate(360deg);
      }
    }

    .flutter-loader {
      display: none;
    }

    .error-message {
      color: #FF5252;
      margin-top: 20px;
      max-width: 80%;
      text-align: center;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      font-size: 14px;
    }
  </style>
</head>

<body>
  <!-- Loading Indicator -->
  <div id="loading-indicator" class="loading-container">
    <div class="loading-indicator"></div>
    <div class="loading-text">NEXT GEN</div>
    <div id="error-container" class="error-message"></div>
  </div>

  <!-- Firebase Configuration -->

  <script src="flutter.js" defer></script>
  <script>
    // Add console logging for debugging
    console.log('Starting app initialization...');

    // The value below is injected by flutter build, do not touch.
    var serviceWorkerVersion = '{{flutter_service_worker_version}}';

    // Global error handler
    window.onerror = function (message, source, lineno, colno, error) {
      console.error('Global error caught:', message, error);
      document.getElementById('error-container').innerHTML = 'Error: ' + message;
      return true;
    };

    window.addEventListener('load', function (ev) {
      console.log('Window load event fired');

      // Get loading indicator element
      const loadingIndicator = document.querySelector('#loading-indicator');
      const errorContainer = document.getElementById('error-container');
      console.log('Loading indicator element:', loadingIndicator);

      // Simple function to show errors
      function showError(message) {
        console.error(message);
        errorContainer.innerHTML = message;
      }

      try {
        // Initialize Flutter
        console.log('Initializing Flutter...');

        // Use a simpler initialization approach
        _flutter.loader.loadEntrypoint({
          serviceWorker: {
            serviceWorkerVersion: serviceWorkerVersion,
          },
          onEntrypointLoaded: function (engineInitializer) {
            console.log('Entrypoint loaded, initializing engine...');
            engineInitializer.initializeEngine().then(function (appRunner) {
              console.log('Engine initialized, running app...');
              // Hide loading indicator before running the app
              loadingIndicator.style.display = 'none';
              appRunner.runApp();
            }).catch(function (error) {
              showError('Failed to initialize Flutter engine: ' + error.message);
            });
          }
        }).catch(function (error) {
          showError('Failed to load Flutter entrypoint: ' + error.message);
        });
      } catch (error) {
        showError('Error during Flutter initialization: ' + error.message);
      }
    });

  </script>
</body>

</html>
